apiVersion: v1
kind: Pod
metadata:
  name: mysql-pod
  labels:
    app: mysql
  namespace: mysql-ns
spec:
  containers:
  - name: mysql
    image: 396561719560.dkr.ecr.us-east-1.amazonaws.com/mysql-image:latest 
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 3306
    env:
    - name: MYSQL_ROOT_PASSWORD
      value: "password"

        

