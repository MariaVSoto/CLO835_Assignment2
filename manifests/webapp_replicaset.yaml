apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: webapp-rs
  namespace: webapp-ns
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: employees 
  template:
    metadata:
      labels:
        app: employees 
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: webapp
        image: 396561719560.dkr.ecr.us-east-1.amazonaws.com/webapp-image:v1
        ports:
        - containerPort: 8080
        env:
        - name: DBPWD
          value: "password"
        - name: DBHOST
          value: "mysql-service.mysql-ns.svc.cluster.local"
        - name: DBUSER
          value: "root"
        - name: DATABASE
          value: "employees"
        - name: DBPORT
          value: "3306"